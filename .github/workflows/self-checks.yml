name: Offence IQ self-checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate app scripts and required features
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const vm = require('node:vm');

          const html = fs.readFileSync('index.html', 'utf8');
          const scripts = [...html.matchAll(/<script\\b[^>]*>([\\s\\S]*?)<\\/script>/gi)];
          if (!scripts.length) throw new Error('No inline application script found.');
          scripts.forEach((match, index) => new vm.Script(match[1], { filename: 'index.html inline script ' + (index + 1) }));

          const required = [
            'const assaultData=', 'const disorderData=', 'const trafficData=',
            'function selectModule(', 'function render(', 'function search',
            'function flashcards(', 'function quiz(', 'function progressView(',
            'selectModule(\\\\'traffic\\\\')'
          ];
          for (const item of required) {
            if (!html.includes(item)) throw new Error('Required app feature/marker missing: ' + item);
          }

          const sw = fs.readFileSync('sw.js', 'utf8');
          new vm.Script(sw, { filename: 'sw.js' });
          JSON.parse(fs.readFileSync('manifest.json', 'utf8'));

          for (const id of ['app']) {
            if (!new RegExp('id=["\\\\']' + id + '["\\\\']').test(html)) {
              throw new Error('Required HTML element missing: #' + id);
            }
          }
          console.log('PASS: inline JavaScript parses, service worker parses, manifest is valid JSON, and core app markers exist.');
          NODE
